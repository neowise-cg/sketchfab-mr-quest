<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sketchfab MR</title>
<style>
:root{--bg:#14161a;--panel:#1d2025;--line:#32363d;--text:#e8e9ec;--dim:#9aa0aa;--acc:#4cc9b0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,sans-serif}
header{display:flex;gap:10px;flex-wrap:wrap;padding:14px 18px;background:var(--panel);border-bottom:1px solid var(--line)}
input,button{font:inherit;padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:#101216;color:var(--text)}
input{flex:1;min-width:200px}
button{cursor:pointer;background:var(--acc);color:#04201a;border:0;font-weight:600}
button:disabled{background:var(--line);color:var(--dim);cursor:default}
button.ghost{background:#101216;color:var(--text);border:1px solid var(--line)}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
main{display:grid;grid-template-columns:minmax(260px,1fr) minmax(300px,1fr);gap:16px;padding:16px 18px}
@media(max-width:800px){main{grid-template-columns:1fr}}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;align-content:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer;padding:0;text-align:left;color:var(--text);font-weight:400}
.card:hover{border-color:var(--acc)}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#000}
.card span{display:block;padding:6px 8px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#view{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;position:sticky;top:12px;align-self:start}
#wrap{width:100%;height:380px;border-radius:6px;overflow:hidden;background:#0b0c0e;position:relative}
#prev{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#0b0c0e;display:none}
#pager{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:14px}
#pager span{color:var(--dim)}
#status{margin:10px 0;color:var(--dim);min-height:2.8em}
#status.err{color:#ff8a7a}
#hint{color:var(--dim);font-size:14px;margin:10px 0 0}
</style>
</head>
<body>
<header>
  <input id="token" type="password" placeholder="API-токен Sketchfab (вставьте один раз)" autocomplete="off">
  <button id="saveTok" class="ghost">Сохранить токен</button>
</header>
<header>
  <input id="q" type="search" placeholder="Поиск моделей, например: dragon">
  <button id="go">Искать</button>
</header>
<main>
  <div><div id="grid"></div><div id="pager"></div></div>
  <div id="view">
    <div id="wrap"><img id="prev" alt=""></div>
    <div id="status">Выберите модель слева.</div>
    <button id="mr" disabled>Войти в MR</button>
    <p id="hint">В MR: курок — переносить, A — поставить на пол, B — зафиксировать/отпустить высоту, левый стик — вращение, правый стик — размер, Y (левый контроллер) — меню освещения; в меню нажимайте правым курком.</p>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script type="importmap">
{"imports":{
 "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
 "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const $ = id => document.getElementById(id);
const statusEl = $('status');
const say = (t, err) => { statusEl.textContent = t; statusEl.className = err ? 'err' : ''; };
const getTok = () => { try { return localStorage.getItem('sf_token') || ''; } catch { return ''; } };
$('token').value = getTok();
$('saveTok').onclick = () => {
  try { localStorage.setItem('sf_token', $('token').value.trim()); say('Токен сохранён.'); }
  catch { say('Не удалось сохранить токен в браузере.', true); }
};

/* ---------- Настройки (запоминаются в браузере шлема) ---------- */
const DEF = { hdriB: 1.5, hdriC: 1, rot: 0, exp: 1.2, con: 1, sat: 1, hue: 0, tmp: 0, tone: 0, shadow: 1, shA: 0.55, shR: 3, map: '' };
const S = { ...DEF };
try { Object.assign(S, JSON.parse(localStorage.getItem('sf_s2') || '{}')); } catch {}
const save = () => { try { localStorage.setItem('sf_s2', JSON.stringify(S)); } catch {} };

/* ---------- Сцена ---------- */
const wrap = $('wrap');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x0b0c0e, 1);
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local-floor');
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.shadowMap.autoUpdate = false;
wrap.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const hemi = new THREE.HemisphereLight(0xffffff, 0x445566, 0.5);
const sun = new THREE.DirectionalLight(0xffffff, 1.0);
sun.position.set(2, 4, 3);
scene.add(hemi, sun, sun.target);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0003;
const shadowMat = new THREE.ShadowMaterial({ opacity: 0.55 });
shadowMat.onBeforeCompile = (shader) => {
  // Enhanced 12-sample Vogel Disk smoothing for wide shadow blur radii without grain
  if (shader.fragmentShader.includes('vogelDiskSample( 0, 5, phi )')) {
    shader.fragmentShader = shader.fragmentShader.replace(
      /#if defined\( SHADOWMAP_TYPE_PCF \)([\s\S]*?)#elif defined\( SHADOWMAP_TYPE_VSM \)/,
      (match) => {
        return match.replace(
          /\( 0, 5, phi \)([\s\S]*?)\* 0\.2;/,
          `( 0, 12, phi ) * radius, shadowCoord.z ) ) +
\t\t\t\t\ttexture( shadowMap, vec3( shadowCoord.xy + vogelDiskSample( 1, 12, phi ) * radius, shadowCoord.z ) ) +
\t\t\t\t\ttexture( shadowMap, vec3( shadowCoord.xy + vogelDiskSample( 2, 12, phi ) * radius, shadowCoord.z ) ) +
\t\t\t\t\ttexture( shadowMap, vec3( shadowCoord.xy + vogelDiskSample( 3, 12, phi ) * radius, shadowCoord.z ) ) +
\t\t\t\t\ttexture( shadowMap, vec3( shadowCoord.xy + vogelDiskSample( 4, 12, phi ) * radius, shadowCoord.z ) ) +
\t\t\t\t\ttexture( shadowMap, vec3( shadowCoord.xy + vogelDiskSample( 5, 12, phi ) * radius, shadowCoord.z ) ) +
\t\t\t\t\ttexture( shadowMap, vec3( shadowCoord.xy + vogelDiskSample( 6, 12, phi ) * radius, shadowCoord.z ) ) +
\t\t\t\t\ttexture( shadowMap, vec3( shadowCoord.xy + vogelDiskSample( 7, 12, phi ) * radius, shadowCoord.z ) ) +
\t\t\t\t\ttexture( shadowMap, vec3( shadowCoord.xy + vogelDiskSample( 8, 12, phi ) * radius, shadowCoord.z ) ) +
\t\t\t\t\ttexture( shadowMap, vec3( shadowCoord.xy + vogelDiskSample( 9, 12, phi ) * radius, shadowCoord.z ) ) +
\t\t\t\t\ttexture( shadowMap, vec3( shadowCoord.xy + vogelDiskSample( 10, 12, phi ) * radius, shadowCoord.z ) ) +
\t\t\t\t\ttexture( shadowMap, vec3( shadowCoord.xy + vogelDiskSample( 11, 12, phi ) * radius, shadowCoord.z ) )
\t\t\t\t) * (1.0 / 12.0);`
        );
      }
    );
  }
};
const SUN_DIR = new THREE.Vector3(0.35, 1, 0.5).normalize();
const shadowPlane = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), shadowMat);
shadowPlane.rotation.x = -Math.PI / 2;
shadowPlane.receiveShadow = true;
scene.add(shadowPlane);
let shadowDirty = true;
const lastM = new THREE.Matrix4();
function updateShadow() {
  if (!S.shadow) return;
  holder.updateMatrixWorld();
  if (lastM.equals(holder.matrixWorld) && !shadowDirty) return;
  lastM.copy(holder.matrixWorld); shadowDirty = false;
  const r = 0.55 * holder.scale.x, c = sun.shadow.camera, y = Math.max(holder.position.y, 0);
  c.left = -r; c.right = r; c.top = r; c.bottom = -r;
  const dist = r * 3 + 1;
  sun.position.copy(holder.position).addScaledVector(SUN_DIR, dist);
  sun.target.position.copy(holder.position);
  c.near = 0.05; c.far = dist + y * 1.4 + r * 2 + 1;
  c.updateProjectionMatrix();
  sun.shadow.normalBias = 0.01 * r;
  renderer.shadowMap.needsUpdate = true;
}

const camera = new THREE.PerspectiveCamera(50, 1, 0.05, 50);
const HOME = new THREE.Vector3(0, 1.0, -0.8);
camera.position.set(0, 1.3, 0.9);
camera.lookAt(HOME);

const holder = new THREE.Group();
holder.position.copy(HOME);
scene.add(holder);

function resize() {
  if (renderer.xr.isPresenting) return;
  const w = wrap.clientWidth, h = wrap.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

/* ---------- Цветокоррекция модели (шейдерная вставка) ---------- */
const U = { bri: { value: 1 }, con: { value: 1 }, sat: { value: 1 }, hue: { value: 0 }, tmp: { value: 0 } };
const GRADE = `uniform float uBri,uCon,uSat,uHue,uTmp;
vec3 grade(vec3 c){
  c*=uBri;
  c*=vec3(1.+uTmp*.25,1.+uTmp*.05,1.-uTmp*.25);
  float cs=cos(uHue),sn=sin(uHue); vec3 k=vec3(.57735);
  c=c*cs+cross(k,c)*sn+k*dot(k,c)*(1.-cs);
  float l=dot(c,vec3(.2126,.7152,.0722)); c=mix(vec3(l),c,uSat);
  c=(c-.5)*uCon+.5;
  return clamp(c,0.,1.);
}
`;
function patch(m) {
  if (m.userData.g) return;
  m.userData.g = 1;
  const prev = m.onBeforeCompile;
  m.onBeforeCompile = (sh, r) => {
    if (prev) prev.call(m, sh, r);
    sh.uniforms.uBri = U.bri; sh.uniforms.uCon = U.con; sh.uniforms.uHue = U.hue; sh.uniforms.uTmp = U.tmp; sh.uniforms.uSat = U.sat;
    sh.fragmentShader = sh.fragmentShader
      .replace('void main() {', GRADE + 'void main() {')
      .replace('#include <colorspace_fragment>', '#include <colorspace_fragment>\n gl_FragColor.rgb = grade(gl_FragColor.rgb);');
  };
  m.customProgramCacheKey = () => 'grade1';
  m.needsUpdate = true;
}

/* ---------- Окружение: HDRI / студия / свет комнаты ---------- */
const pmrem = new THREE.PMREMGenerator(renderer);
let envRT = null, curTex = null;
const envMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false,
  uniforms: { map: { value: null }, k: { value: 1 } },
  vertexShader: 'varying vec3 d; void main(){ d=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }',
  fragmentShader: 'uniform sampler2D map; uniform float k; varying vec3 d; void main(){ vec3 n=normalize(d); vec2 uv=vec2(atan(n.z,n.x)*0.15915494+0.5, asin(clamp(n.y,-1.,1.))*0.31830989+0.5); vec3 c=texture2D(map,uv).rgb; c=pow(max(c,0.)/0.18,vec3(k))*0.18; gl_FragColor=vec4(c,1.); }'
});
const envScene = new THREE.Scene();
envScene.add(new THREE.Mesh(new THREE.SphereGeometry(10, 48, 24), envMat));

function applyEnv() {
  scene.environment = (envRT && envRT.texture) || null;
  scene.environmentIntensity = S.hdriB;
}
function applyScene() {
  const t = !!S.tone;
  renderer.toneMapping = t ? THREE.NeutralToneMapping : THREE.NoToneMapping;
  renderer.toneMappingExposure = t ? S.exp : 1;
  U.bri.value = t ? 1 : S.exp;
  U.con.value = S.con;
  U.hue.value = S.hue * Math.PI / 180;
  U.tmp.value = S.tmp;
  U.sat.value = S.sat;
  scene.environmentIntensity = S.hdriB;
  scene.environmentRotation.y = S.rot * Math.PI / 180;
  shadowPlane.material.opacity = S.shA;
  shadowPlane.visible = !!S.shadow;
  sun.castShadow = !!S.shadow;
  sun.shadow.radius = S.shR;
  shadowDirty = true;
}
function bake() {
  let rt;
  if (curTex) { envMat.uniforms.map.value = curTex; envMat.uniforms.k.value = S.hdriC; rt = pmrem.fromScene(envScene, 0, 0.1, 100); }
  else rt = pmrem.fromScene(new RoomEnvironment(renderer), 0.04);
  if (envRT) envRT.dispose();
  envRT = rt;
  applyEnv();
}
async function loadTex(url) {
  const ext = url.split('.').pop().toLowerCase();
  const u = url.split('/').map(encodeURIComponent).join('/');
  let t;
  if (ext === 'hdr') { const { RGBELoader } = await import('three/addons/loaders/RGBELoader.js'); t = await new RGBELoader().loadAsync(u); }
  else if (ext === 'exr') { const { EXRLoader } = await import('three/addons/loaders/EXRLoader.js'); t = await new EXRLoader().loadAsync(u); }
  else { t = await new THREE.TextureLoader().loadAsync(u); t.colorSpace = THREE.SRGBColorSpace; }
  t.wrapS = THREE.RepeatWrapping; t.minFilter = THREE.LinearFilter; t.generateMipmaps = false;
  return t;
}

/* ---------- Меню освещения в VR ---------- */
const CW = 960, CH = 720, PW = 0.342, PH = PW * CH / CW;
const cv = document.createElement('canvas'); cv.width = CW; cv.height = CH;
const g = cv.getContext('2d');
const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
const menu = new THREE.Group(); menu.visible = false;
menu.position.set(0, 0.13, -0.06); menu.rotation.x = -Math.PI / 2 + 0.6;
const panel = new THREE.Mesh(new THREE.PlaneGeometry(PW, PH), new THREE.MeshBasicMaterial({ map: tex, transparent: true, side: THREE.DoubleSide, toneMapped: false }));
panel.renderOrder = 9;
menu.add(panel);
const dot = new THREE.Mesh(new THREE.SphereGeometry(0.006), new THREE.MeshBasicMaterial({ color: 0xffffff, toneMapped: false, depthTest: false }));
dot.visible = false; dot.renderOrder = 10; scene.add(dot);
const rayLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3(0, 0, -0.7)]), new THREE.LineBasicMaterial({ color: 0x4cc9b0 }));
rayLine.visible = false;

let hits = [], dirty = true, page = 0, tab = 0, msg = '', drag = null, rightC = null;
let maps = [{ name: 'Студия (встроенная)', file: '' }];
const SL = {
  hdri: [['hdriB', 'Яркость HDRI', 0, 4], ['hdriC', 'Контраст HDRI', 0.5, 2], ['rot', 'Вращение карты', -180, 180]],
  scene: [['exp', 'Яркость сцены', 0.2, 3], ['con', 'Контраст', 0.5, 2], ['sat', 'Насыщенность', 0, 2], ['hue', 'Оттенок', -180, 180], ['tmp', 'Температура', -1, 1]],
  shadow: [['shA', 'Сила тени', 0, 1], ['shR', 'Мягкость тени', 1, 40]]
};
const TX = 24, TW = 812;
function rr(x, y, w, h, r, f, s) { g.beginPath(); g.roundRect(x, y, w, h, r); if (f) { g.fillStyle = f; g.fill(); } if (s) { g.strokeStyle = s; g.lineWidth = 3; g.stroke(); } }
function tx(s, x, y, sz, c, al, b) { g.font = `${b ? 600 : 400} ${sz}px system-ui,sans-serif`; g.fillStyle = c; g.textAlign = al || 'left'; g.textBaseline = 'middle'; g.fillText(s, x, y); }
function fit(s, w) { g.font = '600 30px system-ui,sans-serif'; if (g.measureText(s).width <= w) return s; let t = s; while (t.length > 2 && g.measureText(t + '…').width > w) t = t.slice(0, -1); return t + '…'; }
function btn(r, label, on, f, sz) { rr(r[0], r[1], r[2], r[3], 14, on ? '#4cc9b0' : '#101216', '#32363d'); tx(label, r[0] + r[2] / 2, r[1] + r[3] / 2, sz || 30, on ? '#04201a' : '#e8e9ec', 'center', on); hits.push({ r, f }); }
function slider(y, d) {
  const [k, l, mn, mx] = d, v = S[k], f = (v - mn) / (mx - mn);
  tx(l, 24, y + 20, 30, '#e8e9ec', 'left', 1);
  tx((k === 'hue' || k === 'rot') ? Math.round(v) + '°' : v.toFixed(2), 836, y + 20, 30, '#9aa0aa', 'right');
  rr(TX, y + 56, TW, 10, 5, '#32363d'); rr(TX, y + 56, Math.max(10, TW * f), 10, 5, '#4cc9b0');
  g.beginPath(); g.arc(TX + TW * f, y + 61, 20, 0, 7); g.fillStyle = '#fff'; g.fill();
  hits.push({ r: [TX, y + 30, TW, 64], sl: d });
  btn([852, y + 34, 84, 54], '↺', 0, () => { S[k] = DEF[k]; applyScene(); if (k === 'hdriC') bake(); save(); }, 34);
}
function resetTab() {
  const n = ['hdri', 'scene', 'shadow'][tab];
  for (const d of SL[n]) S[d[0]] = DEF[d[0]];
  if (tab === 1) S.tone = DEF.tone;
  if (tab === 2) S.shadow = DEF.shadow;
  applyScene(); if (tab === 0) bake(); save();
}
function draw() {
  g.clearRect(0, 0, CW, CH); hits = [];
  rr(2, 2, CW - 4, CH - 4, 28, '#1d2025f2', '#4cc9b0');
  ['HDRI', 'Сцена', 'Тень'].forEach((n, i) => btn([24 + i * 308, 22, 296, 64], n, tab === i, () => { tab = i; }));
  if (tab === 0) {
    const per = 4, pages = Math.max(1, Math.ceil(maps.length / per));
    page = Math.min(page, pages - 1);
    tx(`Карты HDRI: ${maps.length - 1}`, 24, 118, 28, '#9aa0aa');
    if (pages > 1) {
      btn([700, 96, 80, 44], '◀', 0, () => { page = (page + pages - 1) % pages; }, 26);
      tx(`${page + 1}/${pages}`, 820, 118, 26, '#9aa0aa', 'center');
      btn([860, 96, 76, 44], '▶', 0, () => { page = (page + 1) % pages; }, 26);
    }
    maps.slice(page * per, page * per + per).forEach((m, i) => btn([24, 148 + i * 58, 912, 50], fit(m.name, 860), S.map === m.file, () => pickMap(m)));
    SL.hdri.forEach((d, i) => slider(384 + i * 90, d));
    tx(fit(msg || (maps.length < 2 ? 'Положите .hdr/.exr рядом с index.html на GitHub' : ''), 660), 24, 694, 26, '#ff8a7a');
  } else if (tab === 1) {
    SL.scene.forEach((d, i) => slider(104 + i * 90, d));
    btn([24, 590, 444, 60], `Тон-маппинг: ${S.tone ? 'вкл' : 'выкл'}`, S.tone, () => { S.tone = S.tone ? 0 : 1; applyScene(); save(); }, 28);
    btn([492, 590, 444, 60], `Высота: ${lockY === null ? 'свободна' : 'зафиксирована'}`, lockY !== null, toggleLock, 28);
  } else {
    btn([24, 110, 912, 58], `Тень: ${S.shadow ? 'вкл' : 'выкл'}`, S.shadow, () => { S.shadow = S.shadow ? 0 : 1; applyScene(); save(); }, 28);
    SL.shadow.forEach((d, i) => slider(184 + i * 86, d));
    tx('Быстрые пресеты мягкости:', 24, 376, 26, '#e8e9ec');
    const psts = [
      { l: 'Чёткая (3)', v: 3 },
      { l: 'Мягкая (15)', v: 15 },
      { l: 'Очень мягкая (28)', v: 28 },
      { l: 'Максимум (40)', v: 40 }
    ];
    psts.forEach((p, idx) => {
      btn([24 + idx * 230, 404, 222, 50], p.l, Math.abs(S.shR - p.v) < 1.5, () => {
        S.shR = p.v; applyScene(); save(); dirty = true;
      }, 22);
    });
    tx('Макс. размытие увеличено до 40 с фильтрацией Vogel Disk (12 выборок).', 24, 484, 24, '#4cc9b0');
    tx('Тень падает на пол. Если тормозит — выключите.', 24, 520, 24, '#9aa0aa');
  }
  btn(tab === 0 ? [716, 664, 220, 48] : [24, 660, 912, 50], 'Сбросить всё', 0, resetTab, 28);
}

const ray = new THREE.Raycaster(), pl = new THREE.Plane(), nrm = new THREE.Vector3(), tp = new THREE.Vector3(), tm = new THREE.Matrix4();
function pointer(c) {
  panel.updateWorldMatrix(true, false); c.updateWorldMatrix(true, false);
  tm.extractRotation(c.matrixWorld);
  ray.ray.origin.setFromMatrixPosition(c.matrixWorld);
  ray.ray.direction.set(0, 0, -1).applyMatrix4(tm);
  nrm.set(0, 0, 1).transformDirection(panel.matrixWorld);
  tp.setFromMatrixPosition(panel.matrixWorld);
  pl.setFromNormalAndCoplanarPoint(nrm, tp);
  const hit = ray.ray.intersectPlane(pl, new THREE.Vector3());
  if (!hit) return { inside: false };
  const l = panel.worldToLocal(hit.clone());
  return { inside: Math.abs(l.x) <= PW / 2 && Math.abs(l.y) <= PH / 2, px: (l.x / PW + 0.5) * CW, py: (0.5 - l.y / PH) * CH, world: hit };
}
function setSl(px) {
  const [k, , mn, mx] = drag.sl;
  S[k] = mn + (mx - mn) * Math.min(1, Math.max(0, (px - TX) / TW));
  applyScene();
}
function press(p, c) {
  for (const h of hits) {
    const [x, y, w, hh] = h.r;
    if (p.px >= x && p.px <= x + w && p.py >= y && p.py <= y + hh) {
      if (h.sl) { drag = { c, sl: h.sl }; setSl(p.px); } else h.f();
      dirty = true; return;
    }
  }
}
async function pickMap(m) {
  S.map = m.file; save(); msg = ''; dirty = true;
  if (!m.file) { curTex = null; bake(); return; }
  msg = 'Загрузка…';
  try {
    const t = await loadTex(m.file);
    if (S.map !== m.file) return;
    if (curTex) curTex.dispose();
    curTex = t; bake(); msg = '';
  } catch (e) { msg = 'Не загрузилась (подождите 1–2 мин после загрузки на GitHub)'; }
  dirty = true;
}
async function discover() {
  const ok = /\.(hdr|exr|jpe?g|png|webp)$/i;
  const o = location.hostname.split('.')[0], r = location.pathname.split('/')[1];
  const found = [];
  for (const d of ['hdri', '']) {
    try {
      const x = await fetch(`https://api.github.com/repos/${o}/${r}/contents/${d}`);
      if (!x.ok) continue;
      for (const f of await x.json()) if (f.type === 'file' && ok.test(f.name)) found.push({ name: f.name.replace(/\.[^.]+$/, ''), file: (d ? d + '/' : '') + f.name });
    } catch {}
  }
  if (!found.length) {
    try { const x = await fetch('hdri/list.json'); if (x.ok) for (const n of await x.json()) found.push({ name: n.replace(/\.[^.]+$/, ''), file: 'hdri/' + n }); } catch {}
  }
  maps = [maps[0], ...found]; dirty = true;
  const m = maps.find(m => m.file && m.file === S.map);
  if (m) pickMap(m);
}

/* ---------- Контроллеры ---------- */
let grab = null, grounded = false, aPrev = false, yPrev = false, bPrev = false, lockY = null;
const pulse = src => { try { src.gamepad.hapticActuators[0].pulse(0.5, 60); } catch {} };
function toggleLock() { lockY = lockY === null ? holder.position.y : null; }
const groundSnap = () => { holder.position.y = -holder.scale.x * (holder.userData.minY || 0); };
const off = new THREE.Vector3();
for (let i = 0; i < 2; i++) {
  const c = renderer.xr.getController(i);
  c.addEventListener('connected', e => {
    c.userData.hand = e.data.handedness;
    if (e.data.handedness === 'left') c.add(menu);
    if (e.data.handedness === 'right') { rightC = c; c.add(rayLine); }
  });
  c.addEventListener('selectstart', () => {
    if (menu.visible && c.userData.hand === 'right') {
      const p = pointer(c);
      if (p.inside) { press(p, c); return; }
    }
    grab = c; if (lockY === null) grounded = false;
    off.copy(holder.position); c.worldToLocal(off);
  });
  c.addEventListener('selectend', () => {
    if (drag && drag.c === c) { if (drag.sl[0] === 'hdriC') bake(); save(); drag = null; return; }
    if (grab === c) grab = null;
  });
  scene.add(c);
}

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.1);
  if (renderer.xr.isPresenting) {
    if (grab) { grab.updateMatrixWorld(true); holder.position.copy(off).applyMatrix4(grab.matrixWorld); }
    for (const src of renderer.xr.getSession().inputSources) {
      if (!src.gamepad) continue;
      const a = src.gamepad.axes, b = src.gamepad.buttons;
      if (src.handedness === 'left') {
        holder.rotation.y += (a[2] || 0) * dt * 1.6;
        const yNow = !!(b[5] && b[5].pressed);
        if (yNow && !yPrev) { menu.visible = !menu.visible; rayLine.visible = menu.visible; dot.visible = false; dirty = true; }
        yPrev = yNow;
      } else if (src.handedness === 'right') {
        const k = 1 - (a[3] || 0) * dt * 0.9;
        holder.scale.setScalar(THREE.MathUtils.clamp(holder.scale.x * k, 0.05, 20));
        const aNow = !!(b[4] && b[4].pressed);
        if (aNow && !aPrev) { grounded = true; pulse(src); }
        aPrev = aNow;
        const bNow = !!(b[5] && b[5].pressed);
        if (bNow && !bPrev) { toggleLock(); dirty = true; pulse(src); }
        bPrev = bNow;
      }
    }
    if (grounded) groundSnap();
    if (lockY !== null) { if (grounded) lockY = holder.position.y; else holder.position.y = lockY; }
    if (menu.visible) {
      if (rightC) {
        const p = pointer(rightC);
        dot.visible = !!p.inside;
        if (p.inside) dot.position.copy(p.world);
        if (drag) { const q = pointer(drag.c); if (q.px !== undefined) { setSl(q.px); dirty = true; } }
      }
      if (dirty) { draw(); tex.needsUpdate = true; dirty = false; }
    }
  } else {
    holder.rotation.y += dt * 0.5;
  }
  updateShadow();
  renderer.render(scene, camera);
});

/* ---------- Вход в MR ---------- */
const mrBtn = $('mr'), prev = $('prev');
let sel = null, loadedUid = null, busy = false, xrOk = false;
const setBtn = () => { mrBtn.disabled = !xrOk || !sel || busy; };
async function checkXR() {
  xrOk = !!navigator.xr && await navigator.xr.isSessionSupported('immersive-ar').catch(() => false);
  if (!xrOk) mrBtn.textContent = 'MR недоступен в этом браузере';
  setBtn();
}
async function startMR() {
  const again = t => { mrBtn.textContent = 'Модель готова — запустить MR'; say(t, true); };
  if (navigator.userActivation && !navigator.userActivation.isActive) return again('Модель загружена. Нажмите кнопку ещё раз, чтобы войти в MR (браузер требует нажатия прямо перед запуском).');
  try {
    const s = await navigator.xr.requestSession('immersive-ar', { optionalFeatures: ['local-floor', 'hand-tracking'] });
    scene.background = null;
    renderer.setClearColor(0x000000, 0);
    holder.position.copy(HOME);
    s.addEventListener('end', () => { renderer.setClearColor(0x0b0c0e, 1); menu.visible = false; rayLine.visible = false; dot.visible = false; resize(); });
    await renderer.xr.setSession(s);
    mrBtn.textContent = 'Войти в MR';
  } catch (e) { again('Не удалось запустить MR: ' + e.message + '. Нажмите кнопку ещё раз.'); }
}
mrBtn.onclick = async () => {
  if (!sel || busy) return;
  if (loadedUid !== sel.uid) {
    busy = true; setBtn();
    const ok = await fetchModel(sel);
    busy = false; setBtn();
    if (!ok) return;
  }
  await startMR();
};
checkXR();

/* ---------- Sketchfab ---------- */
const API = 'https://api.sketchfab.com/v3';
const imgs = m => ((m.thumbnails && m.thumbnails.images) || []).slice().sort((a, b) => a.width - b.width);
const licOf = m => (m.license && m.license.label) ? m.license.label : (m.license || '');
const byOf = m => m.user ? (m.user.displayName || m.user.username) : '?';

function selectModel(m) {
  if (m.isDownloadable === false) { sel = null; setBtn(); return say('У этой модели автор отключил скачивание — её нельзя открыть.', true); }
  sel = m;
  mrBtn.textContent = 'Войти в MR';
  const big = imgs(m).filter(i => i.width <= 1024).pop() || imgs(m).pop();
  if (m.uid === loadedUid) prev.style.display = 'none';
  else if (big) { prev.src = big.url; prev.style.display = 'block'; }
  say(`${m.name} — автор: ${byOf(m)}. Лицензия: ${licOf(m)}. Нажмите «Войти в MR»: модель скачается и запустится.`);
  setBtn();
}
function renderGrid(list) {
  const grid = $('grid');
  grid.innerHTML = '';
  for (const m of list) {
    const im = imgs(m);
    const img = im.find(i => i.width >= 200) || im[0];
    const b = document.createElement('button');
    b.className = 'card';
    b.innerHTML = `<img alt=""><span></span>`;
    if (img) b.querySelector('img').src = img.url;
    b.querySelector('span').textContent = m.name;
    b.onclick = () => selectModel(m);
    grid.appendChild(b);
  }
}
let pageUrls = [], pageIdx = 0;
function renderPager(hasNext) {
  const pg = $('pager');
  pg.innerHTML = '';
  if (pageIdx === 0 && !hasNext) return;
  const mk = (t, dis, f) => { const b = document.createElement('button'); b.className = 'ghost'; b.textContent = t; b.disabled = dis; b.onclick = f; return b; };
  const sp = document.createElement('span'); sp.textContent = `Страница ${pageIdx + 1}`;
  pg.append(mk('‹ Назад', pageIdx === 0, () => loadPage(pageIdx - 1)), sp, mk('Вперёд ›', !hasNext, () => loadPage(pageIdx + 1)));
}
async function loadPage(i) {
  say('Ищу…');
  try {
    const r = await fetch(pageUrls[i]);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    pageIdx = i;
    if (d.next) pageUrls[i + 1] = d.next; else pageUrls.length = i + 1;
    renderGrid(d.results || []);
    renderPager(!!d.next);
    say((d.results || []).length ? 'Выберите модель.' : 'Ничего не найдено. Попробуйте другой запрос.');
    scrollTo({ top: 0 });
  } catch (e) { say('Ошибка поиска: ' + e.message, true); }
}
async function byLink(uid) {
  say('Ищу модель по ссылке…');
  try {
    const r = await fetch(`${API}/models/${uid}`);
    if (r.status === 404) throw new Error('модель не найдена или скрыта');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const m = await r.json();
    pageUrls = []; pageIdx = 0;
    renderGrid([m]); renderPager(false);
    say(m.isDownloadable === false ? 'Модель найдена, но автор отключил скачивание.' : 'Модель найдена. Нажмите на неё в списке.', m.isDownloadable === false);
  } catch (e) { say('Ошибка: ' + e.message, true); }
}
async function search() {
  const q = $('q').value.trim();
  if (!q) return say('Введите запрос или ссылку.', true);
  if (/^https?:\/\//i.test(q) || /sketchfab\.com|skfb\.ly/i.test(q)) {
    const mm = q.match(/[0-9a-f]{32}/i);
    if (!mm) return say('Не нашёл идентификатор модели в ссылке. Вставьте полную ссылку со страницы модели (sketchfab.com/3d-models/…); короткие ссылки skfb.ly не поддерживаются.', true);
    return byLink(mm[0].toLowerCase());
  }
  pageUrls = [`${API}/search?type=models&downloadable=true&count=24&archives_max_face_count=150000&q=${encodeURIComponent(q)}`];
  loadPage(0);
}
$('go').onclick = search;
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') search(); });

async function getBuf(url, total, label) {
  const r = await fetch(url);
  if (!r.ok) throw new Error('файл: HTTP ' + r.status);
  if (!r.body || !total) return r.arrayBuffer();
  const rd = r.body.getReader(), parts = [];
  let got = 0;
  for (;;) {
    const { done, value } = await rd.read();
    if (done) break;
    parts.push(value); got += value.length;
    say(`${label}: ${Math.min(100, Math.round(got / total * 100))}%`);
  }
  const out = new Uint8Array(got); let o = 0;
  for (const p of parts) { out.set(p, o); o += p.length; }
  return out.buffer;
}
async function fetchModel(m) {
  const tok = getTok();
  if (!tok) { say('Сначала вставьте API-токен вверху и нажмите «Сохранить токен».', true); return false; }
  say(`Запрашиваю загрузку: ${m.name}…`);
  try {
    const r = await fetch(`${API}/models/${m.uid}/download`, { headers: { Authorization: 'Token ' + tok } });
    if (r.status === 401 || r.status === 403) throw new Error('токен не принят');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const info = await r.json();
    const f = info.glb || info.gltf;
    if (!f) throw new Error('у модели нет glb/gltf');
    const buf = await getBuf(f.url, f.size, `Скачиваю ${(f.size / 1048576).toFixed(1)} МБ`);
    say('Разбираю модель…');
    const gltf = info.glb ? await parseGlb(buf) : await parseZip(buf);
    show(gltf.scene);
    loadedUid = m.uid;
    prev.style.display = 'none';
    say(`${m.name} — автор: ${byOf(m)}. Лицензия: ${licOf(m)}`);
    return true;
  } catch (e) {
    say('Ошибка: ' + e.message + (e instanceof TypeError ? ' (возможно, браузер заблокировал запрос — сообщите мне этот текст)' : ''), true);
    return false;
  }
}
function parseGlb(buf) { return new Promise((res, rej) => new GLTFLoader().parse(buf, '', res, rej)); }
async function parseZip(buf) {
  const zip = await JSZip.loadAsync(buf);
  const urls = {};
  let main;
  for (const [name, f] of Object.entries(zip.files)) {
    if (f.dir) continue;
    urls[name] = URL.createObjectURL(await f.async('blob'));
    if (name.endsWith('.gltf')) main = name;
  }
  if (!main) throw new Error('в архиве нет .gltf');
  const mgr = new THREE.LoadingManager();
  mgr.setURLModifier(u => { const d = decodeURIComponent(u); for (const k in urls) if (d.endsWith(k)) return urls[k]; return u; });
  return new Promise((res, rej) => new GLTFLoader(mgr).load(urls[main], res, undefined, rej));
}
function show(obj) {
  while (holder.children.length) {
    const old = holder.children.pop();
    old.traverse(n => {
      if (n.geometry) n.geometry.dispose();
      if (n.material) [].concat(n.material).forEach(mt => { for (const k in mt) if (mt[k] && mt[k].isTexture) mt[k].dispose(); mt.dispose(); });
    });
  }
  holder.scale.setScalar(1); holder.rotation.set(0, 0, 0); holder.position.copy(HOME);
  const box = new THREE.Box3().setFromObject(obj);
  const size = box.getSize(new THREE.Vector3());
  const k = 0.6 / Math.max(size.x, size.y, size.z, 1e-6);
  const c = box.getCenter(new THREE.Vector3());
  obj.scale.multiplyScalar(k);
  obj.position.set(-c.x * k, -c.y * k, -c.z * k);
  holder.add(obj);
  obj.traverse(n => { if (n.isMesh) n.castShadow = true; if (n.material) [].concat(n.material).forEach(patch); });
  shadowDirty = true;
  holder.updateMatrixWorld(true);
  holder.userData.minY = new THREE.Box3().setFromObject(holder).min.y - holder.position.y;
  grounded = false; lockY = null;
}

applyScene();
bake();
discover();
</script>
</body>
</html>
