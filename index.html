<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sketchfab MR</title>
<style>
:root{--bg:#14161a;--panel:#1d2025;--line:#32363d;--text:#e8e9ec;--dim:#9aa0aa;--acc:#4cc9b0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,sans-serif}
header{display:flex;gap:10px;flex-wrap:wrap;padding:14px 18px;background:var(--panel);border-bottom:1px solid var(--line)}
input,button{font:inherit;padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:#101216;color:var(--text)}
input{flex:1;min-width:200px}
button{cursor:pointer;background:var(--acc);color:#04201a;border:0;font-weight:600}
button:disabled{background:var(--line);color:var(--dim);cursor:default}
button.ghost{background:#101216;color:var(--text);border:1px solid var(--line)}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
main{display:grid;grid-template-columns:minmax(260px,1fr) minmax(300px,1fr);gap:16px;padding:16px 18px}
@media(max-width:800px){main{grid-template-columns:1fr}}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;align-content:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer;padding:0;text-align:left;color:var(--text);font-weight:400}
.card:hover{border-color:var(--acc)}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#000}
.card span{display:block;padding:6px 8px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#view{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;position:sticky;top:12px;align-self:start}
#wrap{width:100%;height:380px;border-radius:6px;overflow:hidden;background:#0b0c0e;position:relative}
#prev{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#0b0c0e;display:none}
#pager{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:14px}
#pager span{color:var(--dim)}
#status{margin:10px 0;color:var(--dim);min-height:2.8em}
#status.err{color:#ff8a7a}
#hint{color:var(--dim);font-size:14px;margin:10px 0 0}
</style>
</head>
<body>
<header>
  <input id="token" type="password" placeholder="API-токен Sketchfab (вставьте один раз)" autocomplete="off">
  <button id="saveTok" class="ghost">Сохранить токен</button>
</header>
<header>
  <input id="q" type="search" placeholder="Поиск моделей, например: dragon">
  <button id="go">Искать</button>
</header>
<main>
  <div><div id="grid"></div><div id="pager"></div></div>
  <div id="view">
    <div id="wrap"><img id="prev" alt=""></div>
    <div id="status">Выберите модель слева.</div>
    <button id="mr" disabled>Войти в MR</button>
    <p id="hint">В MR: курок — переносить, A — поставить на пол, B — зафиксировать/отпустить высоту, левый стик — вращение, правый стик — размер, Y (левый контроллер) — меню освещения; в меню нажимайте правым курком.</p>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script type="importmap">
{"imports":{
 "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
 "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const $ = id => document.getElementById(id);
const statusEl = $('status');
const say = (t, err) => { statusEl.textContent = t; statusEl.className = err ? 'err' : ''; };
const getTok = () => { try { return localStorage.getItem('sf_token') || ''; } catch { return ''; } };
$('token').value = getTok();
$('saveTok').onclick = () => {
  try { localStorage.setItem('sf_token', $('token').value.trim()); say('Токен сохранён.'); }
  catch { say('Не удалось сохранить токен в браузере.', true); }
};

/* ---------- Настройки (запоминаются в браузере шлема) ---------- */
const DEF = { hdriB: 1.5, hdriC: 1, rot: 0, exp: 1.2, con: 1, sat: 1, hue: 0, tmp: 0, tone: 0, aoC: 1.5, hands: 1, hShow: 1, cShow: 1, hOff: 0, shadow: 1, self: 1, vol: 0, shS: 1, shA: 0.55, shR: 3, shRot: 0, shB: 0.5, aoO: 0.7, aoF: 0.6, map: '' };
const S = { ...DEF };
try { Object.assign(S, JSON.parse(localStorage.getItem('sf_s2') || '{}')); } catch {}
const save = () => { try { localStorage.setItem('sf_s2', JSON.stringify(S)); } catch {} };

/* ---------- Сцена ---------- */
const wrap = $('wrap');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x0b0c0e, 1);
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local-floor');
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.shadowMap.autoUpdate = false;
wrap.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const hemi = new THREE.HemisphereLight(0xffffff, 0x445566, 0.5);
const sun = new THREE.DirectionalLight(0xffffff, 1.0);
sun.position.set(2, 4, 3);
scene.add(hemi, sun, sun.target);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0003;
const SUN_DIR = new THREE.Vector3();
function setSunDir() {
  const az = (35 + S.shRot) * Math.PI / 180, el = 1.02;
  SUN_DIR.set(Math.sin(az) * Math.cos(el), Math.sin(el), Math.cos(az) * Math.cos(el));
}
setSunDir();
const shadowPlane = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.ShadowMaterial({ opacity: 0.55 }));
shadowPlane.rotation.x = -Math.PI / 2;
shadowPlane.receiveShadow = true;
scene.add(shadowPlane);
let shadowDirty = true;
const lastM = new THREE.Matrix4();
function updateShadow() {
  if (!S.shadow) return;
  holder.updateMatrixWorld();
  if (lastM.equals(holder.matrixWorld) && !shadowDirty) return;
  lastM.copy(holder.matrixWorld); shadowDirty = false;
  const r = 0.55 * holder.scale.x, c = sun.shadow.camera, y = Math.max(holder.position.y, 0);
  c.left = -r; c.right = r; c.top = r; c.bottom = -r;
  const dist = r * 3 + 1;
  sun.position.copy(holder.position).addScaledVector(SUN_DIR, dist);
  sun.target.position.copy(holder.position);
  c.near = 0.05; c.far = dist + y * 1.4 + r * 2 + 1;
  c.updateProjectionMatrix();
  sun.shadow.normalBias = 0.02 * S.shB * r;
  renderer.shadowMap.needsUpdate = true;
}

const camera = new THREE.PerspectiveCamera(50, 1, 0.005, 50);
const HOME = new THREE.Vector3(0, 1.0, -0.8);
camera.position.set(0, 1.3, 0.9);
camera.lookAt(HOME);

const holder = new THREE.Group();
holder.position.copy(HOME);
scene.add(holder);

function resize() {
  if (renderer.xr.isPresenting) return;
  const w = wrap.clientWidth, h = wrap.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

/* ---------- Объёмная тень на полу ---------- */
const SI = { value: 1 };
shadowPlane.material.onBeforeCompile = sh => {
  sh.uniforms.uInt = SI;
  sh.fragmentShader = sh.fragmentShader
    .replace('void main() {', 'uniform float uInt;\nvoid main() {')
    .replace('getShadowMask()', '( 1.0 - ( 1.0 - getShadowMask() ) / max( uInt, 0.001 ) )');
};
const VR = 512;
const mkRT = () => new THREE.WebGLRenderTarget(VR, VR, { type: THREE.HalfFloatType, depthBuffer: true });
const rtA = mkRT(), rtB = mkRT();
const contactCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 10);
contactCam.layers.set(1);
const VU = { uSh: { value: new THREE.Vector2() }, uMin: { value: 0 }, uH: { value: 1 }, uP: { value: 1.5 } };
const contactMat = new THREE.ShaderMaterial({
  side: THREE.DoubleSide, blending: THREE.NoBlending, uniforms: VU,
  vertexShader: 'uniform vec2 uSh; varying float vH; void main(){ vec4 w=modelMatrix*vec4(position,1.); vH=w.y; w.xz-=uSh*w.y; gl_Position=projectionMatrix*viewMatrix*w; }',
  fragmentShader: 'uniform float uMin,uH,uP; varying float vH; void main(){ float a=pow(1.-clamp((vH-uMin)/uH,0.,1.),uP); gl_FragColor=vec4(a,a,a,1.); }'
});
const blurMat = new THREE.ShaderMaterial({
  depthTest: false, depthWrite: false, uniforms: { t: { value: null }, d: { value: new THREE.Vector2() } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.,1.); }',
  fragmentShader: 'uniform sampler2D t; uniform vec2 d; varying vec2 vUv; void main(){ gl_FragColor=.25*texture2D(t,vUv-d)+.5*texture2D(t,vUv)+.25*texture2D(t,vUv+d); }'
});
const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), blurMat);
quad.frustumCulled = false;
const quadScene = new THREE.Scene(); quadScene.add(quad);
const quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const VF = { t: { value: null }, uC: { value: new THREE.Vector2() }, uE: { value: 1 }, uA: { value: 0.55 } };
const volPlane = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, uniforms: VF,
  vertexShader: 'varying vec2 vW; void main(){ vec4 w=modelMatrix*vec4(position,1.); vW=w.xz; gl_Position=projectionMatrix*viewMatrix*w; }',
  fragmentShader: 'uniform sampler2D t; uniform vec2 uC; uniform float uE,uA; varying vec2 vW; void main(){ vec2 uv=vec2(.5-(vW.x-uC.x)/(2.*uE),.5-(vW.y-uC.y)/(2.*uE)); float m=step(0.,uv.x)*step(uv.x,1.)*step(0.,uv.y)*step(uv.y,1.); gl_FragColor=vec4(0.,0.,0.,texture2D(t,uv).r*uA*m); }'
}));
volPlane.rotation.x = -Math.PI / 2; volPlane.visible = false;
scene.add(volPlane);
let volDirty = true;
const lastV = new THREE.Matrix4(), tmpCol = new THREE.Color();
function updateVol() {
  if (!S.shadow || !S.vol || !holder.children.length) return;
  holder.updateMatrixWorld();
  if (lastV.equals(holder.matrixWorld) && !volDirty) return;
  lastV.copy(holder.matrixWorld); volDirty = false;
  const r = 0.55 * holder.scale.x, hy = Math.max(holder.position.y, 0);
  const sh = new THREE.Vector2(SUN_DIR.x, SUN_DIR.z).multiplyScalar(1 / SUN_DIR.y);
  const E = r * (1 + sh.length()) * 1.15 + 0.1;
  const cx = holder.position.x - sh.x * hy, cz = holder.position.z - sh.y * hy;
  VU.uSh.value.copy(sh);
  VU.uMin.value = holder.position.y + holder.scale.x * (holder.userData.minY || 0);
  VU.uH.value = 1.6 * r;
  contactCam.left = -E; contactCam.right = E; contactCam.top = E; contactCam.bottom = -E;
  contactCam.near = 0; contactCam.far = hy + r * 3 + 1;
  contactCam.position.set(cx, -0.001, cz); contactCam.up.set(0, 0, -1); contactCam.lookAt(cx, 1, cz);
  contactCam.updateProjectionMatrix(); contactCam.updateMatrixWorld();
  VF.uC.value.set(cx, cz); VF.uE.value = E; VF.uA.value = S.shA;
  const xr = renderer.xr.enabled, sm = renderer.shadowMap.enabled, prevRT = renderer.getRenderTarget(), ca = renderer.getClearAlpha();
  renderer.getClearColor(tmpCol);
  renderer.xr.enabled = false; renderer.shadowMap.enabled = false;
  renderer.setClearColor(0x000000, 1);
  scene.overrideMaterial = contactMat;
  renderer.setRenderTarget(rtA); renderer.render(scene, contactCam);
  scene.overrideMaterial = null;
  let src = rtA, dst = rtB;
  const maxS = Math.max(1, S.shR / 3);
  for (let st = 1; st <= maxS; st *= 2) for (const d of [[1, 0], [0, 1]]) {
    blurMat.uniforms.t.value = src.texture; blurMat.uniforms.d.value.set(d[0] * st / VR, d[1] * st / VR);
    renderer.setRenderTarget(dst); renderer.render(quadScene, quadCam);
    const t = src; src = dst; dst = t;
  }
  VF.t.value = src.texture;
  renderer.setRenderTarget(prevRT); renderer.setClearColor(tmpCol, ca);
  renderer.xr.enabled = xr; renderer.shadowMap.enabled = sm;
}

/* ---------- Цветокоррекция модели (шейдерная вставка) ---------- */
const U = { bri: { value: 1 }, con: { value: 1 }, sat: { value: 1 }, hue: { value: 0 }, tmp: { value: 0 }, fAO: { value: 0.6 }, cAO: { value: 1.5 }, fR: { value: 0.2 }, oAO: { value: 0.7 } };
const GRADE = `uniform float uBri,uCon,uSat,uHue,uTmp,uFAO,uFR,uOAO,uCAO;
varying vec3 vWP,vWN;
varying float vAO;
vec3 grade(vec3 c){
  c*=uBri;
  c*=vec3(1.+uTmp*.25,1.+uTmp*.05,1.-uTmp*.25);
  float cs=cos(uHue),sn=sin(uHue); vec3 k=vec3(.57735);
  c=c*cs+cross(k,c)*sn+k*dot(k,c)*(1.-cs);
  float l=dot(c,vec3(.2126,.7152,.0722)); c=mix(vec3(l),c,uSat);
  c=(c-.5)*uCon+.5;
  return clamp(c,0.,1.);
}
`;
const AOF = `#include <aomap_fragment>
{ float oc = 1. - uOAO * (1. - vAO);
  vec3 nw = normalize(vWN + vec3(1e-5));
  float t = clamp(vWP.y / uFR, 0., 1.);
  float fo = pow(1. - t, 2.2) * (.25 + .75 * (.5 - .5 * nw.y));
  float fc = exp(-2. * uFAO * fo);
  float fb = exp(-8. * uCAO * (1. - smoothstep(0., .035, vWP.y)) * (.35 + .65 * (.5 - .5 * nw.y)));
  float ao = clamp(oc * fc * fb, 0., 1.);
  reflectedLight.indirectDiffuse *= ao; reflectedLight.indirectSpecular *= ao;
  reflectedLight.directDiffuse *= mix(1., oc * fc, .3) * mix(1., fb, .8); }`;
function patch(m) {
  if (m.userData.g) return;
  m.userData.g = 1;
  const prev = m.onBeforeCompile;
  m.onBeforeCompile = (sh, r) => {
    if (prev) prev.call(m, sh, r);
    sh.uniforms.uBri = U.bri; sh.uniforms.uCon = U.con; sh.uniforms.uHue = U.hue; sh.uniforms.uTmp = U.tmp; sh.uniforms.uSat = U.sat; sh.uniforms.uFAO = U.fAO; sh.uniforms.uFR = U.fR; sh.uniforms.uOAO = U.oAO; sh.uniforms.uCAO = U.cAO;
    sh.vertexShader = sh.vertexShader
      .replace('void main() {', 'attribute float aAO;\nvarying vec3 vWP,vWN;\nvarying float vAO;\nvoid main() {')
      .replace('#include <project_vertex>', '#include <project_vertex>\n vWP = (modelMatrix * vec4(transformed, 1.)).xyz; vWN = mat3(modelMatrix) * normal; vAO = aAO;');
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <aomap_fragment>', AOF)
      .replace('void main() {', GRADE + 'void main() {')
      .replace('#include <colorspace_fragment>', '#include <colorspace_fragment>\n gl_FragColor.rgb = grade(gl_FragColor.rgb);');
  };
  m.customProgramCacheKey = () => 'grade2';
  m.needsUpdate = true;
}

/* ---------- Окружение: HDRI / студия / свет комнаты ---------- */
const pmrem = new THREE.PMREMGenerator(renderer);
let envRT = null, curTex = null;
const envMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false,
  uniforms: { map: { value: null }, k: { value: 1 } },
  vertexShader: 'varying vec3 d; void main(){ d=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }',
  fragmentShader: 'uniform sampler2D map; uniform float k; varying vec3 d; void main(){ vec3 n=normalize(d); vec2 uv=vec2(atan(n.z,n.x)*0.15915494+0.5, asin(clamp(n.y,-1.,1.))*0.31830989+0.5); vec3 c=texture2D(map,uv).rgb; c=pow(max(c,0.)/0.18,vec3(k))*0.18; gl_FragColor=vec4(c,1.); }'
});
const envScene = new THREE.Scene();
envScene.add(new THREE.Mesh(new THREE.SphereGeometry(10, 48, 24), envMat));

function applyEnv() {
  scene.environment = (envRT && envRT.texture) || null;
  scene.environmentIntensity = S.hdriB;
}
function applyScene() {
  const t = !!S.tone;
  renderer.toneMapping = t ? THREE.NeutralToneMapping : THREE.NoToneMapping;
  renderer.toneMappingExposure = t ? S.exp : 1;
  U.bri.value = t ? 1 : S.exp;
  U.con.value = S.con;
  U.hue.value = S.hue * Math.PI / 180;
  U.tmp.value = S.tmp;
  U.sat.value = S.sat;
  scene.environmentIntensity = S.hdriB;
  scene.environmentRotation.y = S.rot * Math.PI / 180;
  shadowPlane.material.opacity = S.shA;
  shadowPlane.visible = !!S.shadow && !S.vol;
  volPlane.visible = !!S.shadow && !!S.vol;
  VF.uA.value = S.shA;
  SI.value = S.shS;
  sun.shadow.intensity = S.shS;
  sun.castShadow = !!S.shadow && (!S.vol || !!S.self);
  sun.shadow.radius = Math.min(S.shR, 10);
  volDirty = true;
  U.fAO.value = S.aoF;
  U.oAO.value = S.aoO;
  U.cAO.value = S.aoC;
  holder.traverse(n => { if (n.isMesh) n.receiveShadow = !!S.self; });
  setSunDir();
  shadowDirty = true;
}
function bake() {
  let rt;
  if (curTex) { envMat.uniforms.map.value = curTex; envMat.uniforms.k.value = S.hdriC; rt = pmrem.fromScene(envScene, 0, 0.1, 100); }
  else rt = pmrem.fromScene(new RoomEnvironment(renderer), 0.04);
  if (envRT) envRT.dispose();
  envRT = rt;
  applyEnv();
}
async function loadTex(url) {
  const ext = url.split('.').pop().toLowerCase();
  const u = url.split('/').map(encodeURIComponent).join('/');
  let t;
  if (ext === 'hdr') { const { RGBELoader } = await import('three/addons/loaders/RGBELoader.js'); t = await new RGBELoader().loadAsync(u); }
  else if (ext === 'exr') { const { EXRLoader } = await import('three/addons/loaders/EXRLoader.js'); t = await new EXRLoader().loadAsync(u); }
  else { t = await new THREE.TextureLoader().loadAsync(u); t.colorSpace = THREE.SRGBColorSpace; }
  t.wrapS = THREE.RepeatWrapping; t.minFilter = THREE.LinearFilter; t.generateMipmaps = false;
  return t;
}

/* ---------- Меню освещения в VR ---------- */
const CW = 960, CH = 720, PW = 0.342, PH = PW * CH / CW;
const cv = document.createElement('canvas'); cv.width = CW; cv.height = CH;
const g = cv.getContext('2d');
const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
const menu = new THREE.Group(); menu.visible = false;
menu.position.set(0, 0.13, -0.06); menu.rotation.x = -Math.PI / 2 + 0.6;
const panel = new THREE.Mesh(new THREE.PlaneGeometry(PW, PH), new THREE.MeshBasicMaterial({ map: tex, transparent: true, side: THREE.DoubleSide, toneMapped: false }));
panel.renderOrder = 9;
menu.add(panel);
const dot = new THREE.Mesh(new THREE.SphereGeometry(0.006), new THREE.MeshBasicMaterial({ color: 0xffffff, toneMapped: false, depthTest: false }));
dot.visible = false; dot.renderOrder = 10; scene.add(dot);
const rayLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3(0, 0, -0.7)]), new THREE.LineBasicMaterial({ color: 0x4cc9b0 }));
rayLine.visible = false;

let hits = [], dirty = true, page = 0, tab = 0, msg = '', drag = null, rightC = null;
let maps = [{ name: 'Студия (встроенная)', file: '' }];
const SL = {
  hdri: [['hdriB', 'Яркость HDRI', 0, 4], ['hdriC', 'Контраст HDRI', 0.5, 2], ['rot', 'Вращение карты', -180, 180]],
  scene: [['exp', 'Яркость сцены', 0.2, 3], ['con', 'Контраст', 0.5, 2], ['sat', 'Насыщенность', 0, 2], ['hue', 'Оттенок', -180, 180], ['tmp', 'Температура', -1, 1]],
  shadow: [['shA', 'Сила тени', 0, 1], ['shR', 'Мягкость тени', 1, 50], ['shRot', 'Вращение тени', -180, 180], ['shB', 'Смещение тени', 0, 2], ['shS', 'Сила самотеней', 0.1, 20]],
  ao: [['aoO', 'AO объекта', 0, 1.5], ['aoF', 'AO от пола', 0, 3], ['aoC', 'Затемнение у пола (3 см)', 0, 5]]
};
const TX = 24, TW = 812;
function rr(x, y, w, h, r, f, s) { g.beginPath(); g.roundRect(x, y, w, h, r); if (f) { g.fillStyle = f; g.fill(); } if (s) { g.strokeStyle = s; g.lineWidth = 3; g.stroke(); } }
function tx(s, x, y, sz, c, al, b) { g.font = `${b ? 600 : 400} ${sz}px system-ui,sans-serif`; g.fillStyle = c; g.textAlign = al || 'left'; g.textBaseline = 'middle'; g.fillText(s, x, y); }
function fit(s, w) { g.font = '600 30px system-ui,sans-serif'; if (g.measureText(s).width <= w) return s; let t = s; while (t.length > 2 && g.measureText(t + '…').width > w) t = t.slice(0, -1); return t + '…'; }
function btn(r, label, on, f, sz) { rr(r[0], r[1], r[2], r[3], 14, on ? '#4cc9b0' : '#101216', '#32363d'); tx(label, r[0] + r[2] / 2, r[1] + r[3] / 2, sz || 30, on ? '#04201a' : '#e8e9ec', 'center', on); hits.push({ r, f }); }
function slider(y, d) {
  const [k, l, mn, mx] = d, v = S[k], f = (v - mn) / (mx - mn);
  tx(l, 24, y + 20, 30, '#e8e9ec', 'left', 1);
  tx((k === 'hue' || k === 'rot' || k === 'shRot') ? Math.round(v) + '°' : v.toFixed(2), 836, y + 20, 30, '#9aa0aa', 'right');
  rr(TX, y + 56, TW, 10, 5, '#32363d'); rr(TX, y + 56, Math.max(10, TW * f), 10, 5, '#4cc9b0');

async function getBuf(url, total, label) {

  const rd = r.body.getReader(), parts = [];
  let got = 0;
  for (;;) {
    const { done, value } = await rd.read();
    if (done) break;
    parts.push(value); got += value.length;
    say(`${label}: ${Math.min(100, Math.round(got / total * 100))}%`);

  const out = new Uint8Array(got); let o = 0;
  for (const p of parts) { out.set(p, o); o += p.length; }
  return out.buffer;
}
